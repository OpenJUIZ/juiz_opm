name: Release

# Builds juiz_opm (and opm_opl, opm_graph) for Linux, macOS and Windows (decision 0018).
# A pushed tag v* makes a GitHub release with the archives; a manual run only keeps them as
# workflow artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p juiz_opm -p opm_opl -p opm_graph
      - name: Package
        shell: bash
        run: |
          name="juiz_opm-${GITHUB_REF_NAME//\//-}-${{ matrix.target }}"
          mkdir "$name"
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; fi
          for b in juiz_opm opm_opl opm_graph; do
            cp "target/${{ matrix.target }}/release/$b$ext" "$name/"
          done
          cp README.md LICENSE-MIT LICENSE-APACHE docs/usage.md "$name/"
          if [[ "$ext" == ".exe" ]]; then
            7z a "$name.zip" "$name" > /dev/null
            echo "ARCHIVE=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
